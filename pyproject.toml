[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # Prompt templates and SQL queries may exceed 110 chars for readability
    "B008",  # FastAPI Depends()/Query()/File()/Header() defaults are idiomatic
]
