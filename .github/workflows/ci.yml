name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify repository hygiene (no tracked secrets or DBs)
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERROR: .env must not be tracked in Git!"
            exit 1
          fi
          tracked_dbs=$(git ls-files '*.db' '*.sqlite' '*.sqlite3' 'desktop.log')
          if [ -n "$tracked_dbs" ]; then
            echo "ERROR: Runtime database or log files must not be tracked: $tracked_dbs"
            exit 1
          fi

      - name: Lint with Ruff
        run: ruff check .

      - name: Run automated tests
        run: pytest -v

      - name: Verify FastAPI OpenAPI schema generation
        run: |
          python -c "from main import app; schema = app.openapi(); assert len(schema['paths']) >= 20, 'Unexpected OpenAPI path count'; print(f'OpenAPI OK: {len(schema[\"paths\"])} endpoints')"
