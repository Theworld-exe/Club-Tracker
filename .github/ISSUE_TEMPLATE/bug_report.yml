name: Bug Report
description: Report a reproducible bug or unexpected behavior in Club Tracker
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Provide a clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Launch Club Tracker via ...
        2. Navigate to ...
        3. Click / submit ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Launch Mode
      options:
        - Desktop App (ClubTracker.bat / desktop.py)
        - Standalone Windows Executable (PyInstaller)
        - Web Dev Server (run.bat / run.sh / uvicorn)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Python version, and browser/WebView2 details.
      placeholder: "Windows 11, Python 3.11.9"
  - type: textarea
    id: logs
    attributes:
      label: Logs or Error Messages
      description: Paste any relevant traceback or desktop.log lines (remove any API keys or personal data first).
      render: text
